
[project]
name = "arogyanet"
version = "0.1.0"
description = "Pediatric Pneumonia Detection using Deep Learning"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "gradio>=6.31.0",
    "imagehash>=4.3.2",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "mlflow>=3.18.0",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "optuna>=5.0.0",
    "pandas>=3.1.1",
    "pillow>=12.3.0",
    "psutil>=7.2.2",
    "pyyaml>=6.0.3",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "tensorflow[and-cuda]==2.21.0",
    "tqdm>=4.70.1",
    "xgboost>=3.4.1",
]

[tool.uv]
package = false
